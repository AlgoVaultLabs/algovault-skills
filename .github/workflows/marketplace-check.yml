name: Marketplace Health Check

on:
  schedule:
    # OFF THE HOUR, and the reason is documented rather than stylistic. GitHub: "The `schedule`
    # event can be delayed during periods of high loads of GitHub Actions workflow runs. High load
    # times include the start of every hour… To decrease the chance of delay, schedule your
    # workflow to run at a different time of the hour."
    # (docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows,
    # read 2026-09-22). This was the only on-the-hour schedule in the estate, and `0 8` bought
    # nothing: measured across runs #93–#132, dispatch drifted to 11:46–20:08 UTC, an 8.4-hour
    # spread. Moving it does NOT fix that — a cross-repo watcher cannot order itself after a job
    # whose dispatch wanders 8 hours — and the real fix is that the watcher now dates every
    # conclusion it reads (crypto-quant-signal-mcp, OPS-XREPO-CI-CONCLUSION-FRESHNESS-W1-V2).
    # This is the documented mitigation, it costs nothing, and it brings the last on-the-hour
    # schedule into line with the house convention.
    - cron: '37 7 * * *'   # daily 07:37 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify repo + plugin.json still valid
        run: |
          gh repo view AlgoVaultLabs/algovault-skills --json name,visibility,defaultBranchRef \
            | jq -e '.name == "algovault-skills" and .visibility == "PUBLIC"'
          jq -e '.name == "algovault-skills"' .claude-plugin/plugin.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify MCP server reachable
        env:
          MCP_URL: ${{ vars.MARKETPLACE_CANARY_MCP_URL || 'https://api.algovault.com/mcp' }}
        run: |
          set -euo pipefail   # match the runner's `bash -e` explicitly, so local dry-runs reproduce CI
          # ── OPS-MARKETPLACE-CANARY-REPAIR-W1 (2026-08-06) ────────────────────────────
          # THIS STEP FAILED 40 CONSECUTIVE RUNS (2026-06-27 → 2026-08-05) on one line:
          # it asserted `test -n "$SID"`, requiring an Mcp-Session-Id response header.
          #
          # The remote transport runs STATELESS by default (CLAUDE.md §Build rules:
          # `sessionIdGenerator: undefined`, fresh McpServer+transport per POST), and a
          # stateless transport emits NO session header. Verified 2026-08-06: 24 response
          # headers, no mcp-session-id, and the handshake completes fine without one.
          #
          # `MCP_STATELESS=0` is a live rollback lever that WOULD make the server emit one,
          # so the session id is treated as OPTIONAL rather than deleted: captured if
          # present, sent if captured, never fatal if absent. That keeps this canary
          # correct in BOTH transport modes — deleting the check outright would leave it
          # silently no-op'ing the day the lever flips back.
          #
          # Emits exactly one terminal MARKETPLACE_CANARY_VERDICT= line. Fail-closed:
          # an unreachable server or an unparseable body is INDETERMINATE, never PASS.
          ACCEPT="application/json, text/event-stream"
          CANONICAL="get_trade_call scan_funding_arb get_market_regime"

          # ── OPS-XREPO-CI-CONCLUSION-FRESHNESS-W1-V2 CH4 (2026-09-23) ─────────────────
          # RECOVER BEFORE YOU ALERT. Run #131 failed here on 2026-09-21 — step duration 20
          # SECONDS — while #130 and #132 passed on the identical head SHA `ef5c025`. One
          # sample in three. Each call below was a SINGLE un-retried `curl -fsS` against a
          # live HTTP origin, so the origin's transient became this gate's verdict and paged
          # a human. CLAUDE.md precedence rule 6 is Detect -> Recover -> Alert -> Escalate;
          # one attempt performs no Recover at all.
          #
          # AND `-f` IS DROPPED ON PURPOSE. It suppresses the response body, which is the
          # whole diagnosis: the old handler printed "server unreachable or non-2xx" with no
          # code, no body and no timing, so nobody — with or without log access — could tell
          # a 502 from a 429 from a DNS failure. Non-2xx detection moves to an explicit
          # %{http_code} test, and the body's first 400 bytes are logged.
          #
          # HONEST SCOPE, stated rather than papered over (architect Q2=A): a BADGE IS
          # TWO-VALUED. `MARKETPLACE_CANARY_VERDICT` distinguishes FAIL from INDETERMINATE,
          # but both leave this job non-zero, the run conclusion collapses to `failure`, and
          # the badge collapses it again to `failing`. So the cross-repo canary still reads a
          # PERSISTENTLY unreachable server as `failing` rather than "could not verify".
          # Accepted here: the retry above removes the transient class, which is the one that
          # actually fired, and a persistent outage is a real red worth paging on. Splitting
          # the reachability probe into its own workflow (two badges, two bits) was considered
          # and deferred — it is not needed until a persistent outage is misread.
          RETRIES=3
          echo "  + curl: $(curl --version | head -1)"
          if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then
            CURL_RETRY="--max-time 20 --retry $RETRIES --retry-delay 5 --retry-connrefused --retry-all-errors"
            OUTER=1; TRIES=$((RETRIES + 1))
            MECH="curl built-in: --retry $RETRIES --retry-delay 5 --retry-connrefused --retry-all-errors (needs curl >= 7.71)"
          else
            # Never silently drop the flag: an older curl retries only connection failures, so
            # the HTTP-error retry becomes an explicit loop and says so.
            CURL_RETRY="--max-time 20 --retry $RETRIES --retry-delay 5 --retry-connrefused"
            OUTER=$((RETRIES + 1)); TRIES=$OUTER
            MECH="explicit bash loop x$OUTER (this curl predates --retry-all-errors)"
          fi
          echo "  + retry mechanism in force: $MECH"

          verdict() {
            echo "MARKETPLACE_CANARY_VERDICT=$1"
            # Visible where a human actually looks, not only in the raw log. The HTTP code rides
            # along on a non-PASS, because the first question about a red is always "what did the
            # server actually say?".
            {
              echo "### MCP reachability"
              echo ""
              if [ "$1" = "PASS" ]; then
                echo "✅ \`MARKETPLACE_CANARY_VERDICT=PASS\` — $MCP_URL"
              else
                echo "⚠️ \`MARKETPLACE_CANARY_VERDICT=$1\` — $MCP_URL (last HTTP code: \`${CODE:-none}\`, $TRIES attempt(s) via $MECH)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            case "$1" in PASS) exit 0;; FAIL) exit 1;; *) exit 3;; esac
          }

          # An EMPTY body says so. "(empty — the connection never produced one)" is a real
          # diagnosis; a blank line after a label reads as a truncated log.
          body_excerpt() {
            if [ -s "$1" ]; then head -c 400 "$1" | tr -d '\0' | tr '\n' ' '
            else printf '(empty — the connection never produced one)'; fi
          }

          # One request helper for all three calls: retry, capture the code, keep the body.
          req() { # <out-body> <out-hdr> <curl args...>
            local body="$1" hdr="$2"; shift 2
            local attempt=0
            CODE=000
            # TRUNCATE FIRST. A failed curl writes nothing, so a leftover file from an earlier
            # call would be printed as "the body that failed" — a stale extractor wearing a
            # diagnosis's clothes, which is exactly the class this wave exists to retire. Caught
            # in a local dry run: the unreachable-host case proudly quoted the PREVIOUS request's
            # successful response.
            : > "$body"; : > "$hdr"
            while [ "$attempt" -lt "$OUTER" ]; do
              attempt=$((attempt + 1))
              CODE=$(curl -sS $CURL_RETRY -o "$body" -D "$hdr" -w '%{http_code}' "$@" 2>/tmp/curl.err) || CODE=000
              case "$CODE" in 2*) [ "$OUTER" -gt 1 ] && TRIES=$attempt; return 0 ;; esac
              [ "$attempt" -lt "$OUTER" ] && sleep 5
            done
            [ "$OUTER" -gt 1 ] && TRIES=$attempt
            # curl's own retry warnings live on stderr; print them so the attempts are evidenced
            # in the log rather than asserted in a sentence.
            sed 's/^/      curl: /' /tmp/curl.err 2>/dev/null | head -20 || true
            return 1
          }

          if ! req /tmp/init.body /tmp/init.h -X POST "$MCP_URL" \
              -H "Content-Type: application/json" -H "Accept: $ACCEPT" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-05","capabilities":{},"clientInfo":{"name":"marketplace-check","version":"0"}}}'; then
            echo "  x initialize: HTTP $CODE after $TRIES attempt(s) at $MCP_URL"
            echo "  x body (first 400B): $(body_excerpt /tmp/init.body)"
            verdict INDETERMINATE
          fi
          echo "  + initialize: HTTP $CODE from $MCP_URL"

          # OPTIONAL by design — see the note above. Report which mode we observed.
          # `|| true` is load-bearing: GitHub runs this as `bash -e {0}`, and a grep that
          # legitimately finds NOTHING exits 1 — which -e treats as fatal even inside an
          # assignment. Without it the step dies here, printing only the initialize line,
          # which is indistinguishable from the bug this wave just fixed.
          SID=$(grep -i '^mcp-session-id:' /tmp/init.h | tr -d '\r' | awk '{print $2}' || true)
          if [ -n "$SID" ]; then
            echo "  + session: Mcp-Session-Id present (stateful mode, MCP_STATELESS=0)"
            SID_HDR=(-H "mcp-session-id: $SID")
          else
            echo "  + session: no Mcp-Session-Id (stateless default — expected, not a failure)"
            SID_HDR=()
          fi
          # NOTE: expanded below as ${SID_HDR[@]+"${SID_HDR[@]}"} — under `set -u` bash 3.2
          # errors on "${arr[@]}" for an EMPTY array (bash 4.4+ does not). The guarded form
          # works on both, which is what makes this step dry-runnable on a Mac before it
          # ever reaches an ubuntu runner. Do not "simplify" it.

          if ! req /tmp/notif.body /tmp/notif.h -X POST "$MCP_URL" \
              -H "Content-Type: application/json" -H "Accept: $ACCEPT" ${SID_HDR[@]+"${SID_HDR[@]}"} \
              -d '{"jsonrpc":"2.0","method":"notifications/initialized"}'; then
            echo "  x notifications/initialized: HTTP $CODE after $TRIES attempt(s)"
            echo "  x body (first 400B): $(body_excerpt /tmp/notif.body)"
            verdict INDETERMINATE
          fi
          echo "  + notifications/initialized: HTTP $CODE"

          # Body may be SSE-framed (text/event-stream, the live default) or plain JSON.
          # Branch on what arrives; keep both paths working.
          if ! req /tmp/tl.body /tmp/tl.h -X POST "$MCP_URL" \
              -H "Content-Type: application/json" -H "Accept: $ACCEPT" ${SID_HDR[@]+"${SID_HDR[@]}"} \
              -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; then
            echo "  x tools/list: HTTP $CODE after $TRIES attempt(s)"
            echo "  x body (first 400B): $(body_excerpt /tmp/tl.body)"
            verdict INDETERMINATE
          fi
          if grep -qi '^content-type:.*text/event-stream' /tmp/tl.h; then
            FRAMING="SSE"; JSON=$(sed -n 's/^data: //p' /tmp/tl.body | head -1)
          else
            FRAMING="plain-JSON"; JSON=$(cat /tmp/tl.body)
          fi
          NAMES=$(printf '%s' "$JSON" | jq -r '.result.tools[].name' 2>/dev/null)
          if [ -z "$NAMES" ]; then
            echo "  x tools/list body unparseable (framing=$FRAMING)"
            verdict INDETERMINATE
          fi
          TOOL_COUNT=$(printf '%s\n' "$NAMES" | grep -c . || true)
          echo "  + tools/list: framing=$FRAMING, $TOOL_COUNT tool(s)"

          # Permissive >=3 FLOOR, deliberately not equality.
          # Live surface adds backwards-compat aliases over time (e.g. get_trade_signal
          # added in v1.10.0 per OUTPUT-SANITIZE-W1). An `== 3` check rotted silently for
          # 5 days; this canary must detect SHRINKAGE (a real regression), not growth.
          RC=0
          if [ "$TOOL_COUNT" -ge 3 ]; then
            echo "  + tool-count floor: $TOOL_COUNT >= 3"
          else
            echo "  x tool-count floor: $TOOL_COUNT < 3 — the tool surface SHRANK"; RC=1
          fi

          # A count of 3 satisfied by three DIFFERENT tools is a regression the floor
          # alone would pass. Assert the canonical three by name.
          for t in $CANONICAL; do
            if printf '%s\n' "$NAMES" | grep -qx "$t"; then
              echo "  + canonical tool present: $t"
            else
              echo "  x canonical tool MISSING: $t"; RC=1
            fi
          done

          [ "$RC" -eq 0 ] && verdict PASS || verdict FAIL

      # DECISION-CALL-V2-W3: the pre-trade gate plugin (plugins/pre-trade-gate) can only pass
      # an order after its PostToolUse hook has recorded a pre_trade_check. This leg makes one
      # keyless pre_trade_check (BTC long 1000) on the transport above and feeds the result to
      # the hook script exactly as Claude Code would, so a change on either side of that
      # contract (the check's response shape, or the record parser) turns this job red.
      #
      # Emits exactly one terminal PRE_TRADE_GATE_CANARY_VERDICT= line:
      #   PASS  the gate recorded the check's decision
      #   SKIP  the keyless allowance is spent (classifyToolError: quota or upstream throttle);
      #         the job stays green, since a spent allowance says nothing about the gate
      #   FAIL  anything else: no answer, a refusal that is not a quota, or no recorded decision
      - name: Pre-trade gate canary (one keyless pre_trade_check, recorded by the gate)
        env:
          MCP_URL: ${{ vars.MARKETPLACE_CANARY_MCP_URL || 'https://api.algovault.com/mcp' }}
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          WORK=$(mktemp -d)
          ACCEPT="application/json, text/event-stream"

          verdict() {
            echo "PRE_TRADE_GATE_CANARY_VERDICT=$1"
            {
              echo "### Pre-trade gate"
              echo ""
              echo "\`PRE_TRADE_GATE_CANARY_VERDICT=$1\` — $2"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            case "$1" in PASS|SKIP) exit 0;; *) exit 1;; esac
          }

          # The same retry as the reachability step: a transient must not become the verdict.
          CURL=(curl -sS --max-time 20 --retry 3 --retry-delay 5 --retry-connrefused)
          if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then CURL+=(--retry-all-errors); fi
          post() { # <out-file> <json-rpc body>; prints the HTTP code
            "${CURL[@]}" -o "$1" -D "$1.h" -w '%{http_code}' -X POST "$MCP_URL" \
              -H "Content-Type: application/json" -H "Accept: $ACCEPT" ${SID_HDR[@]+"${SID_HDR[@]}"} \
              -d "$2" 2>"$1.err" || true   # a failed call prints 000 through -w
          }

          SID_HDR=()
          CODE=$(post "$WORK/init" '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-05","capabilities":{},"clientInfo":{"name":"pre-trade-gate-canary","version":"0"}}}')
          case "$CODE" in 2*) ;; *) verdict FAIL "initialize answered HTTP $CODE";; esac
          # Optional session id, as above: sent only when the server issues one.
          SID=$(grep -i '^mcp-session-id:' "$WORK/init.h" | tr -d '\r' | awk '{print $2}' || true)
          if [ -n "$SID" ]; then SID_HDR=(-H "mcp-session-id: $SID"); fi

          CODE=$(post "$WORK/call" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"pre_trade_check","arguments":{"coin":"BTC","side":"long","sizeUsd":1000}}}')
          case "$CODE" in 2*) ;; *) verdict FAIL "tools/call answered HTTP $CODE";; esac
          if grep -qi '^content-type:.*text/event-stream' "$WORK/call.h"; then
            sed -n 's/^data: //p' "$WORK/call" | head -1 > "$WORK/rpc.json"
          else
            cp "$WORK/call" "$WORK/rpc.json"
          fi

          cat > "$WORK/canary.mjs" <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [rpcFile, dataDir, root] = process.argv.slice(2);
          const say = (v, d) => { console.log(`${v}|${String(d).split('\n')[0].slice(0, 300)}`); process.exit(0); };
          let rpc;
          try { rpc = JSON.parse(readFileSync(rpcFile, 'utf8')); } catch { say('FAIL', 'the tools/call body is unreadable'); }
          if (rpc.error) say('FAIL', `JSON-RPC error: ${rpc.error.message ?? JSON.stringify(rpc.error)}`);
          const result = rpc.result;
          if (!result || !Array.isArray(result.content)) say('FAIL', 'the tools/call result has no content');
          const text = result.content.find((b) => b && b.type === 'text')?.text ?? '';
          let parsed = null;
          try { parsed = JSON.parse(text); } catch {}
          if (result.isError) {
            const { classifyToolError } = await import(pathToFileURL(join(root, 'tests/smoke/lib/classify-tool-error.mjs')).href);
            const c = classifyToolError(parsed, parsed?.error ?? parsed?.message ?? text);
            if (c.skip) say('SKIP', `${c.kind}: ${c.reason}`);
            say('FAIL', `the check was refused: ${c.reason}`);
          }
          const hook = {
            hook_event_name: 'PostToolUse', session_id: 'marketplace-canary', tool_use_id: 'canary',
            tool_name: 'mcp__algovault__pre_trade_check',
            tool_input: { coin: 'BTC', side: 'long', sizeUsd: 1000 },
            tool_response: result.content,
          };
          const gate = join(root, 'plugins/pre-trade-gate/scripts/gate.mjs');
          const r = spawnSync(process.execPath, [gate, 'record'], {
            input: JSON.stringify(hook), encoding: 'utf8', env: { PATH: process.env.PATH ?? '', CLAUDE_PLUGIN_DATA: dataDir },
          });
          if (r.status !== 0) say('FAIL', `gate.mjs record exited ${r.status}: ${r.stderr.trim()}`);
          const dir = join(dataDir, 'checks', 'marketplace-canary');
          let recs = [];
          try { recs = readdirSync(dir).filter((f) => f.endsWith('.json')).map((f) => JSON.parse(readFileSync(join(dir, f), 'utf8'))); } catch {}
          const rec = recs.find((x) => ['GO', 'CAUTION', 'WAIT'].includes(x.decision));
          if (!rec) say('FAIL', 'the gate recorded no decision');
          say('PASS', `recorded ${rec.coin} ${rec.side} ${rec.decision}${rec.reason_codes.length ? ` (${rec.reason_codes.join(', ')})` : ''}`);
          JS
          OUT=$(node "$WORK/canary.mjs" "$WORK/rpc.json" "$WORK/data" "$ROOT" || echo "FAIL|the canary script itself failed")
          echo "  + $OUT"
          V="${OUT%%|*}"
          case "$V" in PASS|SKIP|FAIL) ;; *) V=FAIL; OUT="FAIL|unexpected canary output: $OUT";; esac
          verdict "$V" "${OUT#*|}"

      # OPS-MARKETPLACE-CANARY-REPAIR-W1: the canary being red is survivable; NOBODY KNOWING
      # for 40 runs is the actual defect, and this step is why. It resolved both secrets to
      # empty, printed one WARN line into a log nobody opens, and exited 0 — dark by
      # construction. Measured: this repo holds ANTHROPIC_PR_TOKEN and MCP_REPO_DISPATCH_TOKEN,
      # and no Telegram credentials at all.
      #
      # ARCHITECT RULING: the primary alert does NOT live here. Duplicating bot credentials
      # into a second repo was rejected; instead a scheduled detector in
      # crypto-quant-signal-mcp reads this workflow's last conclusion and alerts through the
      # existing, proven send_telegram.sh on the Hetzner host. This step stays as an
      # opportunistic in-repo alert IF someone ever provisions the secrets.
      #
      # The fail-open shape is kept deliberately — a broken alerter must never mask a
      # passing canary — but an UNCONFIGURED alerter is now loud at configuration time
      # (job summary + ::warning annotation) instead of silent at failure time.
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning title=Marketplace canary alerting is UNCONFIGURED::This job FAILED and no in-repo Telegram alert could be sent. Primary alerting is the cross-repo detector in crypto-quant-signal-mcp (ops/monitoring). If that is also down, this failure reaches nobody."
            {
              echo "### ⚠️ In-repo alerting unconfigured"
              echo ""
              echo "This job failed and \`TELEGRAM_BOT_TOKEN\` / \`TELEGRAM_CHAT_ID\` are not set in this repo."
              echo "By design: the primary alert is the cross-repo detector in \`crypto-quant-signal-mcp\`, which uses the existing \`send_telegram.sh\` on Hetzner so bot credentials live in one place."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MSG="🟡 AlgoVault Alert%0A%0Aalgovault-skills marketplace-check FAILED at $(date -u +%Y-%m-%dT%H:%M:%SZ)%0Acheck: gh run view ${{ github.run_id }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data "text=${MSG}" >/dev/null
